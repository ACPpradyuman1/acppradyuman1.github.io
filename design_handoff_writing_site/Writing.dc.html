<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #faf8f4; }
  a { color: #1a1917; text-decoration: none; }
  a:hover { color: #4c6b5a; }
  ::selection { background: #dfe7e0; }
</style>
</helmet>
<div style="min-height: 100vh; background: #faf8f4; color: #1a1917; font-family: Newsreader, Georgia, serif;">

  <div style="max-width: 760px; margin: 0 auto; padding: 0 28px;">

    <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; gap: 24px; padding: 30px 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;">
      <a href="#" style="letter-spacing: 0.02em;">prateek</a>
      <div style="display: flex; gap: 14px; justify-content: center; font-size: 11.5px; font-family: 'JetBrains Mono', monospace;">
        <a href="#" style="color: #66625a;" style-hover="color: #1a1917;">linkedin</a>
        <a href="#" style="color: #66625a;" style-hover="color: #1a1917;">email</a>
        <a href="#" style="color: #66625a;" style-hover="color: #1a1917;">x</a>
      </div><nav style="display: flex; gap: 20px; justify-content: flex-end; color: #66625a;">
        <a href="#" style="color: #1a1917; border-bottom: 1px solid #4c6b5a; padding-bottom: 2px;">writing</a>
        
        <a href="#" style="color: #66625a;" style-hover="color: #1a1917;">about</a>
      </nav>
    </header>

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 32px; padding: 56px 0 44px; border-top: 1px solid #e6e1d8;">
      <div style="max-width: 46ch;">
        <h1 style="margin: 0; font-size: 44px; font-weight: 300; letter-spacing: -0.015em; line-height: 1.05;">writing</h1>
        <p style="margin: 18px 0 0; font-size: 19px; line-height: 1.55; color: #55524a; text-wrap: pretty; width: 789px; height: 98px">investment theses, company analysis, and whatever else is worth thinking through in public. long where it needs to be, short where it doesn't.</p>
      </div>
      <sc-if value="{{ showPixelArt }}" hint-placeholder-val="{{ true }}">
        
      </sc-if>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 34px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px;">
      <span style="padding: 5px 11px; border: 1px solid #1a1917; color: #faf8f4; background: #1a1917;">all</span>
      
      
      
      
    </div>

    <sc-for list="{{ years }}" as="year" hint-placeholder-count="2">
      <section style="border-top: 1px solid #e6e1d8; padding: 26px 0 8px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.14em; color: #6f6a5d; padding-bottom: 14px;">{{ year.label }}</div>
        <sc-for list="{{ year.posts }}" as="post" hint-placeholder-count="3">
          <a href="Post.dc.html" style="display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid #f0ece3;" style-hover="background: #f5f2ea;">
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.7; color: #66625a; padding-top: 4px;">
              <div>{{ post.date }}</div>
              <div style="color: #4c6b5a;">{{ post.kind }}</div>
            </div>
            <div>
              <div style="font-size: 22px; font-weight: 400; line-height: 1.3; letter-spacing: -0.01em;">{{ post.title }}</div>
              <sc-if value="{{ showDeks }}" hint-placeholder-val="{{ true }}">
                <div style="margin-top: 7px; font-size: 16.5px; line-height: 1.55; color: #6a6659; text-wrap: pretty;">{{ post.dek }}</div>
              </sc-if>
              
            </div>
          </a>
        </sc-for>
      </section>
    </sc-for>

    

  </div>

  <sc-if value="{{ showPixelArt }}" hint-placeholder-val="{{ true }}">
    <div style="max-width: 1100px; margin: 64px auto 0; padding: 0 28px;">
      <div style="border: 1px solid #e6e1d8; background: #f7f4ed; overflow: hidden; line-height: 0;">
        
      </div>
    </div>
  </sc-if>

  

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showPixelArt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;showDeks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      showPixelArt: this.props.showPixelArt ?? true,
      showDeks: this.props.showDeks ?? true,
      years: [
        {
          label: "2026",
          posts: [
            { date: "Aug 2026", kind: "thesis", title: "Placeholder: the case for X", dek: "Your one- or two-sentence summary of the argument goes here — replace with real copy.", meta: "12 min · markets" },
            { date: "May 2026", kind: "teardown", title: "Placeholder: company teardown", dek: "What the business actually does, what the numbers say, where the argument breaks.", meta: "9 min · teardowns" },
            { date: "Feb 2026", kind: "note", title: "Placeholder: a short note", dek: "Short pieces can drop the summary line entirely.", meta: "3 min · notes" }
          ]
        },
        {
          label: "2025",
          posts: [
            { date: "Nov 2025", kind: "thesis", title: "Placeholder: sector thesis", dek: "Replace with your own writing — these five entries exist to show the list rhythm.", meta: "15 min · theses" },
            { date: "Jun 2025", kind: "analysis", title: "Placeholder: analysis piece", dek: "Titles run long here on purpose, so you can see how two lines sit against the date rail.", meta: "8 min · markets" }
          ]
        }
      ]
    };
  }
}

</script>
</body>
</html>
